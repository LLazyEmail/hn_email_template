# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '34 19 * * 6'

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install ESLint
        run: |
          mkdir -p "$RUNNER_TEMP/eslint-ci"
          npm install --prefix "$RUNNER_TEMP/eslint-ci" eslint@9 @microsoft/eslint-formatter-sarif@3

      - name: Run ESLint
        working-directory: scripts
        run: |
          set +e
          # Flat config is scripts/eslint.config.js (not at repo root) so
          # sub-modules keep their legacy .eslintrc + --ext CLI flags.
          "$RUNNER_TEMP/eslint-ci/node_modules/.bin/eslint" . \
            --format "$RUNNER_TEMP/eslint-ci/node_modules/@microsoft/eslint-formatter-sarif/sarif.js" \
            --output-file "$GITHUB_WORKSPACE/eslint-results.sarif"
          lint_exit=$?
          if [ ! -f "$GITHUB_WORKSPACE/eslint-results.sarif" ]; then
            printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"ESLint","informationUri":"https://eslint.org","rules":[]}},"results":[]}]}' > "$GITHUB_WORKSPACE/eslint-results.sarif"
          fi
          exit $lint_exit

      - name: Upload analysis results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
