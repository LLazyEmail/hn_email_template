# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── scripts/ generator (template-runtime-display requires Node >= 24) ──────
  scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ./scripts
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: scripts/package-lock.json
        registry-url: https://npm.pkg.github.com
        scope: '@llazyemail'
    - name: Install dependencies
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Test
      run: npm test
    - name: Generate HN template
      run: node generate-template.js --out=../generated/hn.html
    - name: Upload generated HTML
      uses: actions/upload-artifact@v4
      with:
        name: generated-hn-html
        path: generated/hn.html
        retention-days: 7

  # ── Sub-modules (Typography, innerComponents, Miscellaneous) ─────────────────
  sub-modules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        submodule: [Typography, innerComponents, Miscellaneous]

    defaults:
      run:
        working-directory: ./sub-modules/${{ matrix.submodule }}

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        # Fails the job if the sub-module lockfile is out of sync
        cache-dependency-path: sub-modules/${{ matrix.submodule }}/package-lock.json
    - name: Install dependencies (lockfile consistency check)
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Build (validates bundling and catches unresolved imports)
      run: npm run build
    - name: Test
      run: npm test
